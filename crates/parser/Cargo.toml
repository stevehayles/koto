[package]
name = "koto_parser"
version = "0.16.0"
description = "The parser used by the Koto programming language"

authors.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true

[features]
default = ["rc", "num64"]

# Only one memory management strategy can be enabled at a time.
# To use `arc`, default features must be disabled.
rc = ["koto_memory/rc"]
arc = ["koto_memory/arc"]
num64 = []
num32 = []

[package.metadata.cargo-feature-requirements]
rc = { requires = ["!arc"] }
arc = { requires = ["!rc"] }
num64 = { requires = ["!num32"] }
num32 = { requires = ["!num64"] }

# Panicking be useful during development, e.g. to see the backtrace that led to the error
panic_on_parser_error = []

[dependencies]
koto_lexer = { path = "../lexer", version = "^0.16.0" }
koto_memory = { path = "../memory", version = "^0.16.0", default-features = false }

derive-name = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }
unicode-segmentation = { workspace = true }
